alias: "Printer Cyan"
id: printer_cyan
trigger:
  - platform: state
    entity_id: sensor.hp_color_laser_150nw_cyan_toner_s_n_crum_240426a6203
condition:
  - condition: template
    value_template: "{{ not is_state('sensor.hp_color_laser_150nw_cyan_toner_s_n_crum_240426a6203', 'unavailable') }}"
action:
  - action: mqtt.publish
    data:
      topic: "printer/cyan"
      payload: "{{ states('sensor.hp_color_laser_150nw_cyan_toner_s_n_crum_240426a6203') }}"
      retain: true
