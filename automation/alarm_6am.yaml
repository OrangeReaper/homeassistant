alias: Alarm 6am
trigger:
  platform: time
  # Military time format. This trigger will fire at 6:00 AM
  at: '05:58:00'
action:
  - data:
      entity_id: media_player.roberts_radio_2
    entity_id: media_player.roberts_radio_2
    service: media_player.turn_on
  - data:
      entity_id: media_player.roberts_radio_2
      volume_level: 0.4
    entity_id: media_player.roberts_radio_2
    service: media_player.volume_set
  - data:
      entity_id: media_player.roberts_radio_2
      source: 'DAB'
    service: media_player.select_source
