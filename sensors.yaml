
  - platform: time_date
    display_options:
      - 'time'
      - 'date'
      - 'date_time'
      - 'date_time_iso'
      - 'time_date'
      - 'time_utc'

#Template updated 20-May-2022 to accommodate moving Harmony Remote into Mancave
  - platform: template
    sensors:
      harmony_activity:
        value_template: >
          {% if is_state_attr('remote.harmony_hub', 'current_activity', 'BluRay') %}
            BluRay
          {% else %}
            {% if is_state_attr('remote.harmony_hub', 'current_activity', 'Plex') %}
              Plex
            {% else %}
              {% if is_state_attr('remote.harmony_hub', 'current_activity', 'Roku') %}
                Roku
              {% else %}
                {% if is_state_attr('remote.harmony_hub', 'current_activity', 'power_off') %}
                  PowerOff
                {% endif %}
              {% endif %}
            {% endif %}
          {% endif %}

#Change on 21-May-2022 to use state of media player to determine if lounge is occupied
  - platform: template
    sensors:
      lounge_occupied:
        value_template: >
          {% if is_state('media_player.living_room', 'playing') %}
            yes
          {% else %}
            no
          {% endif %}

#Template updated 20-May-2022 to accommodate moving Harmony Remote into Mancave
  - platform: template
    sensors:
      mancave_occupied:
        value_template: >
          {% if is_state("sensor.harmony_activity", 'BluRay') %}
            yes
          {% else %}
            {% if is_state("sensor.harmony_activity", 'Plex') %}
              yes
            {% else %}
              {% if is_state("sensor.harmony_activity", 'Roku') %}
                yes
              {% else %}
                no
              {% endif %}
            {% endif %}
          {% endif %}

  - platform: template
    sensors:
      plex:
        value_template: >
          {% if is_state("sensor.harmony_activity", 'Plex') %}
            on
          {% else %}
            off
          {% endif %}

  - platform: template
    sensors:
      enterprise:
        value_template: >
          {% if is_state("binary_sensor.enterprise", 'on') %}
            on
          {% else %}
            {% if is_state("binary_sensor.enterprise2", 'on') %}
              on
            {% else %}
              off
            {% endif %}
          {% endif %}

#Template updated 10-Nov-2022 to only use Sun Elevation & Time of day to decide
  - platform: template
    sensors:
      dark:
        friendly_name: "It's Dark"
        value_template: >-
          {% if is_state("sensor.mqtt_force_dark", 'on') %}
            yes
          {% else %}
            {% if (states.sensor.time.state > "00:00") and (states.sensor.time.state < "07:00") %}
              no
            {% else %}
              {% if state_attr('sun.sun', 'elevation') > 0  %}
                no
              {% else %}
                yes
              {% endif %}
            {% endif %}
          {% endif %}

  - platform: template
    sensors:
      all_home:
        friendly_name: "All Home"
        value_template: >-
          {% if is_state('sensor.paula', 'home')  %}
            {% if is_state('sensor.andy', 'home') %}
              yes
            {% else %}
              no
            {% endif %}
          {% else %}
            no
          {% endif %}

  - platform: template
    sensors:
      any_home:
        friendly_name: "Someone is Home"
        value_template: >-
          {% if is_state('sensor.paula', 'home')  %}
            yes
          {% else %}
            {% if is_state('sensor.andy', 'home') %}
              yes
            {% else %}
              no
            {% endif %}
          {% endif %}

  - platform: template
    sensors:
      paula:
        friendly_name: "Paula"
        value_template: >-
          {% if is_state('device_tracker.paula_pixel_7', 'home')  %}
                home
          {% else %}
            {% if is_state('sensor.paula_pixel_7_wi_fi_ip_address', '192.168.1.14')  %}
                home
            {% else %}
              {% if is_state('binary_sensor.paula_phone_wifi', 'on')  %}
                home
              {% else %}
                away
              {% endif %}
            {% endif %}
          {% endif %}

  - platform: template
    sensors:
      andy:
        friendly_name: "Andy"
        value_template: >-
          {% if is_state('device_tracker.pixel_7', 'home')  %}
                home
          {% else %}
            {% if is_state('sensor.andy_pixel_7_wifi_ip_address', '192.168.1.90')  %}
                home
            {% else %}
              {% if is_state('binary_sensor.andy_phone_wifi', 'on')  %}
                home
              {% else %}
                away
              {% endif %}
            {% endif %}
          {% endif %}

