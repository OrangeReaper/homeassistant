#      - "activities/steps"

# Weather prediction
  - platform: time_date
    display_options:
      - 'time'
      - 'date'
      - 'date_time'
      - 'date_time_iso'
      - 'time_date'
      - 'time_utc'

#Template updated 20-May-2022 to accommodate moving Harmony Remote into Mancave
  - platform: template
    sensors:
      harmony_activity:
        value_template: >
          {% if is_state_attr('remote.harmony_hub', 'current_activity', 'BluRay') %}
            BluRay
          {% else %}
            {% if is_state_attr('remote.harmony_hub', 'current_activity', 'Plex') %}
              Plex
            {% else %}
              {% if is_state_attr('remote.harmony_hub', 'current_activity', 'Roku') %}
                Roku
              {% else %}
                {% if is_state_attr('remote.harmony_hub', 'current_activity', 'power_off') %}
                  PowerOff
                {% endif %}
              {% endif %}
            {% endif %}
          {% endif %}

#Change on 21-May-2022 to use state of media player to determine if lounge is occupied
  - platform: template
    sensors:
      lounge_occupied:
        value_template: >
          {% if is_state('sensor.any_home', 'no') %}
            no
          {% else %}
            {% if is_state('media_player.living_room', 'playing') %}
              yes
            {% else %}
              no
            {% endif %}
          {% endif %}

#Template updated 20-May-2022 to accommodate moving Harmony Remote into Mancave
  - platform: template
    sensors:
      mancave_occupied:
        value_template: >
          {% if is_state("sensor.harmony_activity", 'BluRay') %}
            yes
          {% else %}
            {% if is_state("sensor.harmony_activity", 'Plex') %}
              yes
            {% else %}
              {% if is_state("sensor.harmony_activity", 'Roku') %}
                yes
              {% else %}
                no
              {% endif %}
            {% endif %}
          {% endif %}

  - platform: template
    sensors:
      fitbit_changed:
        value_template: "{{ states.sensor.steps.last_updated }}"
        device_class: timestamp

  - platform: template
    sensors:
      plex:
        value_template: >
          {% if is_state("sensor.harmony_activity", 'Plex') %}
            on
          {% else %}
            {% if states('sensor.andymote') == "Watch Plex"  %}
              on
            {% else %}
              off
            {% endif %}
          {% endif %}

  - platform: template
    sensors:
      enterprise:
        value_template: >
          {% if is_state("binary_sensor.enterprise", 'on') %}
            on
          {% else %}
            {% if is_state("binary_sensor.enterprise2", 'on') %}
              on
            {% else %}
              off
            {% endif %}
          {% endif %}

#Template updated 10-Nov-2022 to only use Sun Elevation & Time of day to decide
  - platform: template
    sensors:
      dark:
        friendly_name: "It's Dark"
        value_template: >-
          {% if (states.sensor.time.state > "09:00") and (states.sensor.time.state < "15:00") %}
            no
          {% else %}
            {% if (states.sensor.time.state > "00:00") and (states.sensor.time.state < "07:00") %}
              no
            {% else %}
              {% if state_attr('sun.sun', 'elevation') > 0  %}
                no
              {% else %}
                yes
              {% endif %}
            {% endif %}
          {% endif %}

  - platform: template
    sensors:
      all_home:
        friendly_name: "All Home"
        value_template: >-
          {% if is_state('sensor.paula', 'home')  %}
            {% if is_state('sensor.andy', 'home') %}
              yes
            {% else %}
              no
            {% endif %}
          {% else %}
            no
          {% endif %}

  - platform: template
    sensors:
      any_home:
        friendly_name: "Someone is Home"
        value_template: >-
          {% if is_state('sensor.paula', 'home')  %}
            yes
          {% else %}
            {% if is_state('sensor.andy', 'home') %}
              yes
            {% else %}
              no
            {% endif %}
          {% endif %}

  - platform: template
    sensors:
      paula:
        friendly_name: "Paula"
        value_template: >-
          {% if is_state('timer.paula_away', 'active')  %}
                home
          {% else %}
            {% if is_state('timer.paula_home', 'active')  %}
                away
            {% else %}
              {% if is_state('device_tracker.paula_phone_bt', 'home')  %}
                  home
              {% else %}
                {% if is_state('binary_sensor.paula_phone_wifi', 'on')  %}
                  home
                {% else %}
                  away
                {% endif %}
              {% endif %}
            {% endif %}
          {% endif %}

  - platform: template
    sensors:
      andy:
        friendly_name: "Andy"
        value_template: >-
          {% if is_state('timer.andy_away', 'active')  %}
                home
          {% else %}
            {% if is_state('timer.andy_home', 'active')  %}
                away
            {% else %}
              {% if is_state('device_tracker.andy_phone_bt', 'home')  %}
                  home
              {% else %}
                {% if is_state('binary_sensor.andy_phone_wifi', 'on')  %}
                  home
                {% else %}
                  away
                {% endif %}
              {% endif %}
            {% endif %}
          {% endif %}

  - platform: template
    sensors:
      porch_pir_battery:
        friendly_name: "Porch PIR Battery"
        value_template: "{{ state_attr('zwave.porch_motion_sensor', 'battery_level')|int|default(75) }}"
        device_class: battery
        unit_of_measurement: '%'

  - platform: template
    sensors:
      hive_battery:
        friendly_name: "Hive Battery"
        value_template: '{{ states.climate.hive_temperature.attributes.battery | replace("%","") | int }}'

  - platform: template
    sensors:
      nextsunrise:
        friendly_name: 'Next Sunrise'
        value_template: >
          {{ as_timestamp(states.sun.sun.attributes.next_rising) | timestamp_custom(' %I:%M%p') | replace(" 0", "") }}
        icon_template: mdi:weather-sunset-up
      nextsunset:
        friendly_name: 'Next Sunset'
        value_template: >
          {{ as_timestamp(states.sun.sun.attributes.next_setting) | timestamp_custom(' %I:%M%p') | replace(" 0", "") }}
        icon_template: mdi:weather-sunset-down
      night_length_today:
        friendly_name: 'Night Length Today'
        value_template: >
          {{ (as_timestamp(state_attr('sun.sun','next_rising')) - as_timestamp(state_attr('sun.sun','next_setting')))| int  }}
      dark_offset:
        friendly_name: 'Dark Offset'
        value_template: >
          {{ ((states('sensor.night_length_today') | int - 26933 | int) * 0.058269399) | int  }}
      time_to_next_sunset:
        friendly_name: 'Time To Next Sunset'
        value_template: >
          {{ as_timestamp(state_attr('sun.sun','next_setting')) | int - as_timestamp(now()) | int  }}
      elevation:
        friendly_name: 'Sun Elevation'
        value_template: >
          {{ state_attr('sun.sun','elevation') }}
