title: Ground
id: ground
path: ground
icon: mdi:alpha-g-box
cards:
  - type: vertical-stack
    cards:
      - type: entity-filter
        entities:
          - entity: binary_sensor.multisensor_6_motion_detection
            name: "Hall"
          - entity: binary_sensor.porch_sensor_motion_detection
            name: "Porch"
          - entity: binary_sensor.pir_motion_temperature_light_sensor_motion_detection
            name: "Landing"
          - entity: binary_sensor.stair_sensor_motion_detection
            name: "Stairs"
        state_filter:
          - "on"
          - "off"
        card:
          type: glance
          title: Movement
          show_state: true
      - type: entities
        title: Hall & Landing
        show_header_toggle: false
        entities:
          - switch.hall_light
          - switch.landing_light
          - light.porch_light
          - switch.stair_cupboard
      - type: entities
        title: Kitchen Lights
        show_header_toggle: true
        entities:
          - switch.kitchen_leds
          - switch.kitchen_units
          - switch.kitchen_lamp
          - switch.little_light


#      - type: custom:mini-media-player
      - type: media-control
        name: 'Kitchen Radio'
        entity: media_player.jl_tenor

      - type: history-graph
        title: Kitchen Radio Connectivity
        entities:
          - entity: binary_sensor.192_168_1_180
        hours_to_show: 24
        refresh_interval: 30

#      - type: custom:mini-media-player
      - type: media-control
        name: 'Kitchen TV'
        entity: media_player.24_sharp_roku_tv
