title: Ground
id: ground
path: ground
icon: mdi:alpha-g-box
cards:
  - type: vertical-stack
    cards:
      - type: media-control
        entity: media_player.roku_streaming_stick
      - type: entity-filter
        entities:
          - entity: binary_sensor.multisensor_6_home_security_motion_detection
            name: "Hall"
          - entity: binary_sensor.pir_motion_sensor_3_home_security_motion_detection
            name: "Porch"
        state_filter:
          - "on"
          - "off"
        card:
          type: glance
          title: Movement
          show_state: true
      - type: entities
        title: Controls
        show_header_toggle: false
        entities:
          - switch.hall_light
          - switch.porch_light
      - type: entities
        title: Kitchen Lights
        show_header_toggle: true
        entities:
          - switch.led_lights
          - switch.kitchen_units
          - switch.kitchen_lamp
      - type: custom:mini-media-player
        name: 'Kitchen Radio'
        entity: media_player.jl_tenor
