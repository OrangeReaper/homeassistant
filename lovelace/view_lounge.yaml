title: Lounge
id: lounge
path: lounge
icon: mdi:seat
cards:
  - type: vertical-stack
    cards:
      - type: horizontal-stack
        title: Unit Lights (New)
        cards:
          - type: button
            name: "On"
            icon: mdi:lightbulb-on
            icon_height: 50px
            tap_action:
              action: perform-action
              perform_action: switch.turn_on
              target:
                entity_id: switch.unit_lights
          - type: button
            name: "Off"
            icon: mdi:lightbulb-off
            icon_height: 50px
            tap_action:
              action: perform-action
              perform_action: switch.turn_off
              target:
                entity_id: switch.unit_lights

      - type: horizontal-stack
        title: Unit Lights (Old)
        cards:
          - type: button
            name: "On"
            icon: mdi:lightbulb-on
            icon_height: 50px
            tap_action:
              action: perform-action
              perform_action: script.unit_lights_on
          - type: button
            name: "Off"
            icon: mdi:lightbulb-off
            icon_height: 50px
            tap_action:
              action: perform-action
              perform_action: script.unit_lights_off

      - type: custom:mini-media-player
        name: 'Lounge TV'
        entity: media_player.living_room_tv

      - type: custom:mini-media-player
        name: 'Sonos ARC'
        entity: media_player.living_room

      - type: custom:mini-media-player
        name: 'Panasonic BluRay'
        entity: media_player.dmr_pwt550

      - type: entities
        title: Controls
        show_header_toggle: true
        entities:
          - entity: switch.lounge_lamp
          - entity: light.floor_lamp
          - entity: switch.christmas_tree
          
      - type: light
        entity: light.floor_lamp
        name: Floor Lamp

