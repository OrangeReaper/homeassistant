title: Overview
id: overview
path: overview
icon: mdi:home
cards:
  - type: vertical-stack
    cards:
      - type: entities
        title: Links
        entities:
          - type: weblink
            name: Alternative Home Page
            url: https://habond.duckdns.org:8123/local/index.html
            icon: mdi:home
      - type: horizontal-stack
        cards:
          - type: picture-entity
            state_image: 
              "home": /local/andy.jpg
              "away": /local/andy_bw.jpg
            entity: sensor.andy
          - type: picture-entity
            state_image:
              "home": /local/paula.jpg
              "away": /local/paula_bw.jpg
            entity: sensor.paula
      - type: entities
        title: Fitbit
        show_header_toggle: false
        entities:
          - entity: sensor.versa_4_battery
          - entity: sensor.steps
          - entity: sensor.weight
          - entity: sensor.fitbit_changed
      - type: horizontal-stack
        cards:
          - type: sensor
            entity: sensor.nextsunrise
            graph: none
            name: Next Sunrise
          - type: sensor
            entity: sensor.nextsunset
            graph: none
            name: Next Sunset
          - type: sensor
            entity: sensor.elevation
            graph: none
            name: Curr Elev
      - type: horizontal-stack
        cards:
        - type: sensor
          entity: sensor.lee_on_the_solent_temperature_3_hourly
          name: Met Office Temp
          graph: line
          unit: deg
        - type: sensor
          entity: sensor.lee_on_the_solent_probability_of_precipitation_3_hourly
          name: Met Office Rain Prob
          graph: line
          unit: '%'
      - type: horizontal-stack
        cards:
        - type: sensor
          entity: sensor.lee_on_the_solent_weather_3_hourly
          name: Weather
        - type: sensor
          entity: sensor.lee_on_the_solent_wind_speed_3_hourly
          name: Wind Speed
          graph: line
          unit: mph
      - type: horizontal-stack
        cards:
          - type: thermostat
            entity: climate.hive_temperature
            name: Hive Temp
      - type: horizontal-stack
        cards:
          - type: sensor
            icon: mdi:thermometer
            entity: sensor.pir_motion_sensor_3_air_temperature
            graph: none
            name: Porch Temp
          - type: sensor
            icon: mdi:thermometer
            entity: sensor.multisensor_6_air_temperature
            graph: none
            name: Hall Temp
      - type: horizontal-stack
        cards:
          - type: sensor
            icon: mdi:brightness-5
            entity: sensor.pir_motion_sensor_3_illuminance
            graph: none
            name: Porch Lum
          - type: sensor
            icon: mdi:brightness-5
            entity: sensor.multisensor_6_illuminance
            graph: none
            name: Hall Lum
          - type: sensor
            entity: sensor.dark
            name: It's Dark
      - type: horizontal-stack
        cards:
          - type: gauge
            name: Porch PIR Batt
            unit: '%'
            entity: sensor.pir_motion_sensor_3_battery_level
            severity:
              red: 0
              yellow: 45
              green: 85
          - type: gauge
            name: Hive Batt
            unit: '%'
            entity: sensor.hive_temperature_battery_level
            severity:
              red: 0
              yellow: 45
              green: 85

