title: Overview
id: overview
path: overview
icon: mdi:home
cards:
  - type: vertical-stack
    cards:
      - type: entities
        title: Links
        entities:
          - type: weblink
            name: Alternative Home Page
            url: https://habond.duckdns.org:8123/local/index.html
            icon: mdi:home
      - type: horizontal-stack
        cards:
          - type: picture-entity
            state_image: 
              "home": /local/andy.jpg
              "away": /local/andy_bw.jpg
            entity: sensor.andy
          - type: picture-entity
            state_image:
              "home": /local/paula.jpg
              "away": /local/paula_bw.jpg
            entity: sensor.paula
      - type: horizontal-stack
        cards:
          - type: sensor
            entity: sensor.nextsunrise
            graph: none
            name: Next Sunrise
          - type: sensor
            entity: sensor.nextsunset
            graph: none
            name: Next Sunset
          - type: sensor
            entity: sensor.elevation
            graph: none
            name: Curr Elev
      - type: horizontal-stack
        cards:
          - type: sensor
            icon: mdi:thermometer
            entity: sensor.porch_sensor_air_temperature
            graph: line
            name: Porch Temp
          - type: sensor
            icon: mdi:thermometer
            entity: sensor.multisensor_6_air_temperature
            graph: line
            name: Hall Temp
          - type: sensor
            icon: mdi:thermometer
            entity: sensor.landing_sensor_air_temperature
            graph: line
            name: Landing Temp
      - type: horizontal-stack
        cards:
          - type: sensor
            icon: mdi:brightness-5
            entity: sensor.porch_sensor_illuminance
            graph: none
            name: Porch Lum
          - type: sensor
            icon: mdi:brightness-5
            entity: sensor.multisensor_6_illuminance
            graph: none
            name: Hall Lum
          - type: sensor
            entity: sensor.dark
            name: It's Dark
      - type: horizontal-stack
        cards:
          - type: gauge
            name: Porch PIR Batt
            unit: '%'
            entity: sensor.porch_sensor_battery_level
            severity:
              red: 0
              yellow: 45
              green: 85
          - type: gauge
            name: Landing PIR Batt
            unit: '%'
            entity: sensor.landing_sensor_battery_level
            severity:
              red: 0
              yellow: 45
              green: 85

