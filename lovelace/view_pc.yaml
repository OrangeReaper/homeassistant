title: Pc
id: pc
path: pc
icon: mdi:desktop-classic
cards:
  - type: vertical-stack
    cards:

    - type: entities
      title: Server Status
      show_header_toggle: false
      entities:
        - entity: binary_sensor.192_168_1_235
          name: Tycho-A
        - entity: binary_sensor.192_168_1_15
          name: Saratoga
        - entity: binary_sensor.192_168_1_96
          name: Pi Hole
        - entity: binary_sensor.hive_hub_status
          name: Hive Hub
    - type: horizontal-stack
      cards:
        - type: button
          name: Enterprise
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.enterprise_toggle2
            service_data: {}
          entity: switch.enterprise_toggle2
          icon_height: 50px
          icon: phu:desktop-computer
        - type: button
          name: Lexington
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.lexington_toggle2
            service_data: {}
          entity: switch.lexington_toggle2
          icon_height: 50px
          icon: phu:desktop-computer
        - type: button
          name: Exelsior
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.excelsior_toggle
            service_data: {}
          entity: switch.excelsior_toggle
          icon_height: 50px
          icon: phu:desktop-computer
        - type: button
          name: Defiant
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.defiant_toggle
            service_data: {}
          entity: switch.defiant_toggle
          icon_height: 50px
          icon: mdi:server

    - type: horizontal-stack
      title: Enterprise USB Drives
      cards:
        - type: button
          name: USB Grp 1
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.pc_usb_group1
            service_data: {}
          entity: switch.pc_usb_group1
          icon_height: 50px
          icon: mdi:harddisk
        - type: button
          name: Jellyfin
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.jellyfin
            service_data: {}
          entity: switch.jellyfin
          icon_height: 50px
          icon: mdi:harddisk
        - type: button
          name: Dual USB
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.dual_usb1
            service_data: {}
          entity: switch.dual_usb1
          icon_height: 50px
          icon: mdi:harddisk
        - type: button
          name: Lex Bak
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.lex_usb_bak
            service_data: {}
          entity: switch.lex_usb_bak
          icon_height: 50px
          icon: mdi:harddisk

    - type: horizontal-stack
      title: PC Controls
      cards:
        - type: button
          name: Light
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.pc_light
            service_data: {}
          entity: switch.pc_light
          icon_height: 50px
          icon: mdi:lightbulb
        - type: button
          name: Speaker
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.pc_speaker
            service_data: {}
          entity: switch.pc_speaker
          icon_height: 50px
          icon: mdi:speaker

    - type: vertical-stack
      title: Tycho Temperatures
      cards:
      - type: horizontal-stack
        cards:
        - type: sensor
          entity: sensor.mqtt_tychocputemp
          icon: mdi:thermometer
          name: CPU
          graph: line
          unit: deg
        - type: sensor
          entity: sensor.mqtt_tychopcitemp
          icon: mdi:thermometer
          name: PCI
          graph: line
          unit: deg
        - type: sensor
          entity: sensor.mqtt_tychoacpitemp
          icon: mdi:thermometer
          name: ACPI
          graph: line
          unit: deg

    - type: vertical-stack
      title: Printer
      cards:
      - type: entities
        show_header_toggle: false
        entities:
          - binary_sensor.192_168_1_40
      - type: horizontal-stack
        cards:
          - type: gauge
            name: black
            theme: card_black_border
            unit: '%'
            entity: sensor.hp_color_laser_150nw_black_toner_s_n_crum_240426a5e3d
            severity:
              red: 0
              yellow: 10
              green: 40
          - type: gauge
            name: cyan
            unit: '%'
            entity: sensor.hp_color_laser_150nw_cyan_toner_s_n_crum_240426a6203
            severity:
              red: 0
              yellow: 10
              green: 40
          - type: gauge
            name: magenta
            unit: '%'
            entity: sensor.hp_color_laser_150nw_magenta_toner_s_n_crum_240426a4a9b
            severity:
              red: 0
              yellow: 10
              green: 40
          - type: gauge
            name: yellow
            unit: '%'
            entity: sensor.hp_color_laser_150nw_yellow_toner_s_n_crum_240426a5e0b
            severity:
              red: 0
              yellow: 10
              green: 40


