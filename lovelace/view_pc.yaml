title: Pc
id: pc
path: pc
icon: mdi:desktop-classic
cards:
  - type: vertical-stack
    cards:

    - type: entities
      title: Server Status
      show_header_toggle: false
      entities:
        - entity: binary_sensor.192_168_1_235
          name: Tycho-A
        - entity: binary_sensor.plex_server
          name: saratoga
        - binary_sensor.pihole

    - type: horizontal-stack
      cards:
        - type: button
          name: Enterprise
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.enterprise_toggle
            service_data: {}
          entity: switch.enterprise_toggle
          icon_height: 50px
          icon: phu:desktop-computer
        - type: button
          name: Lexington
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.lexington_toggle
            service_data: {}
          entity: switch.lexington_toggle
          icon_height: 50px
          icon: phu:desktop-computer
        - type: button
          name: Exelsior
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.excelsior_toggle
            service_data: {}
          entity: switch.excelsior_toggle
          icon_height: 50px
          icon: phu:desktop-computer
        - type: button
          name: Defiant
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.defiant_toggle
            service_data: {}
          entity: switch.defiant_toggle
          icon_height: 50px
          icon: mdi:server

    - type: horizontal-stack
      title: Enterprise USB Drives
      cards:
        - type: button
          name: USB Group 1
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.tasmota
            service_data: {}
          entity: switch.tasmota
          icon_height: 50px
          icon: mdi:harddisk
        - type: button
          name: Jellyfin
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.jellyfin
            service_data: {}
          entity: switch.jellyfin
          icon_height: 50px
          icon: mdi:harddisk
        - type: button
          name: Dual USB1
          show_state: true
          tap_action:
            action: call-service
            service: switch.toggle
            target:
              entity_id: switch.dual_usb1
            service_data: {}
          entity: switch.dual_usb1
          icon_height: 50px
          icon: mdi:harddisk

    - type: entities
      title: Other Controls
      show_header_toggle: false
      entities:
        - switch.pc_light

    - type: vertical-stack
      title: Tycho Temperatures
      cards:
      - type: horizontal-stack
        cards:
        - type: sensor
          entity: sensor.mqtt_tychocputemp
          icon: mdi:thermometer
          name: CPU
          graph: line
          unit: deg
        - type: sensor
          entity: sensor.mqtt_tychopcitemp
          icon: mdi:thermometer
          name: PCI
          graph: line
          unit: deg
        - type: sensor
          entity: sensor.mqtt_tychoacpitemp
          icon: mdi:thermometer
          name: ACPI
          graph: line
          unit: deg

    - type: vertical-stack
      title: Printer
      cards:
      - type: entities
        show_header_toggle: false
        entities:
          - sensor.hp_color_laser_150nw
      - type: horizontal-stack
        cards:
          - type: gauge
            name: black
            theme: card_black_border
            unit: '%'
            entity: sensor.black
            severity:
              red: 0
              yellow: 10
              green: 40
          - type: gauge
            name: cyan
            unit: '%'
            entity: sensor.cyan
            severity:
              red: 0
              yellow: 10
              green: 40
          - type: gauge
            name: magenta
            unit: '%'
            entity: sensor.magenta
            severity:
              red: 0
              yellow: 10
              green: 40
          - type: gauge
            name: yellow
            unit: '%'
            entity: sensor.yellow
            severity:
              red: 0
              yellow: 10
              green: 40


