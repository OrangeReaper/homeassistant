# include,  If set, all other entities will not be recorded
  include:
    domains:
       - automation
       - sensor
       - binary_sensor
       - switch
       - light
       - script
       - device_tracker
    entity_globs:
      - sensor.mqtt_tycho*temp
  exclude:
    entities:
      - sensor.date_time
      - sensor.time_date
      - sensor.date_time_iso
      - sensor.internet_time
      - sensor.time
      - sensor.time_utc
      - sensor.yr_symbol
      - sensor.time_to_next_sunset
      - sensor.dark_offset
      - sensor.night_length_today
      - sensor.elevation
      - sensor.multisensor_6_last_seen
      - sensor.pir_motion_sensor_3_last_seen
      - sensor.landing_sensor_last_seen
      - sensor.node_7_last_seen
      - sensor.hp_color_laser_150nw_yellow_toner_s_n_crum_240426a5e0b
      - sensor.hp_color_laser_150nw_cyan_toner_s_n_crum_240426a6203
      - sensor.hp_color_laser_150nw_black_toner_s_n_crum_240426a5e3d
      - sensor.hp_color_laser_150nw_magenta_toner_s_n_crum_240426a4a9b
    entity_globs:
      - sensor.mqtt*
      - sensor.*last_seen
      - sensor.*energy_totalstarttime
      - sensor.*ip_address
