  tts_say:
    alias: 'Say Message'
    fields:
      message:
        name: 'Message to Speak'
        description: 'the text'
        required: true
        selector:
          text:
    sequence:
      - service: tts.speak
        data:
          message: "{{ message }}"
          media_player_entity_id: media_player.tycho_squeezelite
          options:
            voice: en_GB-northern_english_male-medium
        target:
          entity_id: tts.piper

  turn_on_lounge_lights:
    sequence:
      - service: homeassistant.turn_on
        data:
          entity_id: group.lounge_lights
      - service: script.turn_on
        target:
          entity_id: script.unit_lights_on

  turn_off_lounge_lights:
    sequence:
      - service: homeassistant.turn_off
        data:
          entity_id: group.lounge_lights
      - service: script.turn_on
        target:
          entity_id: script.unit_lights_off

  unit_lights_on:
    alias: "Unit Lights On"
    mode: queued
    max: 5
    sequence:
      - repeat:
          count: 5
          sequence:
            - action: remote.send_command
              target:
                entity_id: remote.broadlink_remote
              data:
                device: unit_lights
                command: "on"
            - delay: "00:00:02"

  unit_lights_off:
    alias: "Unit Lights Off"
    mode: queued
    max: 5
    sequence:
      - repeat:
          count: 5
          sequence:
            - action: remote.send_command
              target:
                entity_id: remote.broadlink_remote
              data:
                device: unit_lights
                command: "off"
            - delay: "00:00:02"

  lounge_tv_on:
    alias: "Lounge TV On"
    mode: restart
    sequence:
      - repeat:
          count: 5
          sequence:
            - service: remote.send_command
              target:
                entity_id: remote.broadlink_remote
              data:
                device: lg_tv
                command: "on"
            - delay: "00:00:00.2"

  lounge_tv_off:
    alias: "Lounge TV Off"
    mode: restart
    sequence:
      - repeat:
          count: 5
          sequence:
            - service: remote.send_command
              target:
                entity_id: remote.broadlink_remote
              data:
                device: lg_tv
                command: "off"
            - delay: "00:00:00.2"

  panasonic_dmr_off:
    alias: "Panasonic DMR Off"
    mode: restart
    sequence:
      - repeat:
          count: 5
          sequence:
            - service: remote.send_command
              target:
                entity_id: remote.broadlink_remote
              data:
                device: panasonic_pmr
                command: "off"
            - delay: "00:00:00.2"

  turn_on_defiant:
    sequence:
      - service: homeassistant.turn_on
        data:
          entity_id: switch.defiant_2
      - delay: '00:00:02'
      - service: homeassistant.turn_on
        data:
          entity_id: switch.defiant_2
      - delay: 30
      - service: homeassistant.turn_on
        data:
          entity_id: switch.defiant_wol

  turn_off_defiant:
    sequence:
      - service: homeassistant.turn_off
        data:
          entity_id: switch.defiant_wol

  hall_light_on:
    sequence:
      - service: homeassistant.turn_on
        data:
          entity_id: switch.hall_light

  hall_light_off:
    sequence:
      - service: homeassistant.turn_off
        data:
          entity_id: switch.hall_light
      - service: script.turn_on
        entity_id: script.porch_light_off

  stair_light_on:
    sequence:
      - service: homeassistant.turn_on
        data:
          entity_id: switch.stair_cupboard

  stair_light_off:
    sequence:
      - service: homeassistant.turn_off
        data:
          entity_id: switch.stair_cupboard

  landing_light_on:
    sequence:
      - service: homeassistant.turn_on
        data:
          entity_id: switch.landing_light
      - delay: 90
      - service: script.turn_on
        entity_id: script.landing_light_off

  landing_light_off:
    sequence:
      - service: homeassistant.turn_off
        data:
          entity_id: switch.landing_light

  porch_light_on:
    sequence:
      - service: homeassistant.turn_on
        data:
          entity_id: light.porch_light
      - service: automation.trigger
        target:
          entity_id: automation.hall_light_motion_control

  porch_light_off:
    sequence:
      - service: homeassistant.turn_off
        data:
          entity_id: light.porch_light
          
  porch_light_toggle:
    alias: "Porch Light Toggle"
    sequence:
      - service: light.toggle
        target:
          entity_id: light.porch_light

  plex_on:
    sequence:
      - service: switch.turn_on
        data: {}
        target:
          entity_id: switch.saratoga_usb
      - delay: '00:00:02'
      - service: wake_on_lan.send_magic_packet
        data:
          broadcast_port: 9
          mac: 10:7C:61:22:83:A2

  plex_off:
    sequence:
      - service: shell_command.turn_off_plex
      - delay: '00:03:00'
      - service: switch.turn_off
        data: {}
        target:
          entity_id: switch.saratoga_usb

  mount_plex_drive:
    sequence:
      - service: shell_command.plex_mount_all

  enterprise_on:
    sequence:
      - service: switch.turn_on
        data:
          entity_id: switch.enterprise_wol

  enterprise_off:
    sequence:
      - service: switch.turn_off
        data:
          entity_id: switch.enterprise_wol

  excelsior_on:
    sequence:
      - service: switch.turn_on
        data:
          entity_id: switch.excelsior_wol

  excelsior_off:
    sequence:
      - service: switch.turn_off
        data:
          entity_id: switch.excelsior_wol

  lexington_on:
    sequence:
      - service: switch.turn_on
        data:
          entity_id: switch.lexington_wol

  lexington_off:
    sequence:
      - service: switch.turn_off
        data:
          entity_id: switch.lexington_wol

  update_pc:
    sequence:
        - service: script.turn_on
          entity_id: script.plex_on
        - delay: '00:15:00'
        - service: script.turn_on
          entity_id: script.lexington_on
        - delay: '00:15:00'
        - service: script.turn_on
          entity_id: script.plex_off
        - delay: '00:15:00'
        - service: script.turn_on
          entity_id: script.lexington_off

  kitchen_radio_off:
    sequence:
      - service: media_player.turn_off
        target:
          entity_id: media_player.jl_tenor
        data: {}

  kitchen_radio_on:
    sequence:
      - service: media_player.turn_on
        target:
          entity_id: media_player.jl_tenor
        data: {}
      - service: media_player.volume_set
        target:
          entity_id: media_player.jl_tenor
        data:
          volume_level: 0.375
      - service: media_player.select_source
        target:
          entity_id: media_player.jl_tenor
        data:
          source: 'Internet radio'

  kitchen_radio_aux:
    mode: restart
    sequence:
      # Try to wake the device
      - service: media_player.turn_on
        target:
          entity_id: media_player.jl_tenor

      # Give the radio time to come online
      - delay: "00:00:05"

      # Wait until HA sees it as available/on
      - wait_template: >
          {{ states('media_player.jl_tenor') != 'off'
             and states('media_player.jl_tenor') != 'unavailable' }}
        timeout: "00:00:15"
        continue_on_timeout: true

      # Now change source
      - service: media_player.select_source
        target:
          entity_id: media_player.jl_tenor
        data:
          source: "AUX in"

      - delay: "00:00:01"

      - service: media_player.volume_set
        target:
          entity_id: media_player.jl_tenor
        data:
          volume_level: 0.66

  wake_up_alarm:
    sequence:
      - service: media_player.turn_on
        target:
          entity_id: media_player.roberts_radio
        data: {}
      - service: media_player.volume_set
        target:
          entity_id: media_player.roberts_radio
        data:
          volume_level: 0.31
      - service: media_player.select_source
        target:
          entity_id: media_player.roberts_radio
        data:
          source: 'Internet radio'

  force_dark_on:
    sequence:
      - service: mqtt.publish
        data:
          topic: "homeassistant/modes/force_dark"
          payload: "on"
          retain: true

  force_dark_off:
    sequence:
      - service: mqtt.publish
        data:
          topic: "homeassistant/modes/force_dark"
          payload: "off"
          retain: true

  force_dark_timed:
    description: "Temporarily enable force_dark for a given number of minutes"
    fields:
      duration:
        description: "Time to keep force_dark on (in minutes)"
        example: 15
    sequence:
      - service: script.force_dark_on
      - delay:
          minutes: "{{ duration }}"
      - service: script.force_dark_off

  holiday_mode_on:
    sequence:
      - service: mqtt.publish
        data:
          topic: "homeassistant/modes/holiday_mode"
          payload: "on"
          retain: true
      - service: homeassistant.turn_off
        target:
          entity_id: automation.excelsior_auto_switch_on
      - service: homeassistant.turn_off
        data:
          entity_id: automation.lounge_lights
      - service: homeassistant.turn_off
        target:
          entity_id: automation.lounge_lights
      - service: homeassistant.turn_off
        target:
          entity_id: automation.lounge_lights_2
      - service: homeassistant.turn_off
        target:
          entity_id: automation.mancave_light_on
      - service: homeassistant.turn_off
        target:
          entity_id: automation.mancave_light_on_2
      - service: homeassistant.turn_off
        target:
          entity_id: automation.radio_to_aux

  holiday_mode_off:
    sequence:
      - service: mqtt.publish
        data:
          topic: "homeassistant/modes/holiday_mode"
          payload: "off"
          retain: true
      - service: homeassistant.turn_on
        target:
          entity_id: automation.excelsior_auto_switch_on
      - service: homeassistant.turn_on
        data:
          entity_id: automation.lounge_lights
      - service: homeassistant.turn_on
        target:
          entity_id: automation.lounge_lights
      - service: homeassistant.turn_on
        target:
          entity_id: automation.lounge_lights_2
      - service: homeassistant.turn_on
        target:
          entity_id: automation.mancave_light_on
      - service: homeassistant.turn_on
        target:
          entity_id: automation.mancave_light_on_2
      - service: homeassistant.turn_on
        target:
          entity_id: automation.radio_to_aux
