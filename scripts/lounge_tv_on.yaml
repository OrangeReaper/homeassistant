  lounge_tv_on:
    alias: "Lounge TV On"
    mode: restart
    sequence:
      - repeat:
          count: 5
          sequence:
            - action: remote.send_command
              target:
                entity_id: remote.broadlink_remote
              data:
                device: lg_tv
                command: "on"
            - delay: "00:00:00.2"
