  lounge_tv_off:
    alias: "Lounge TV Off"
    mode: restart
    sequence:
      - repeat:
          count: 5
          sequence:
            - action: remote.send_command
              target:
                entity_id: remote.broadlink_remote
              data:
                device: lg_tv
                command: "off"
            - delay: "00:00:00.2"
