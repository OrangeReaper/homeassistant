 kitchen_radio_aux:
    mode: single
    sequence:
      - repeat:
          count: 5
          sequence:
            # Try to wake the device
            - action: media_player.turn_on
              target:
                entity_id: media_player.jl_tenor

            - delay: "00:00:02"

      # Give the radio time to come online
      - delay: "00:00:02"

      # Now change source
      - action: media_player.select_source
        target:
          entity_id: media_player.jl_tenor
        data:
          source: "AUX in"

      - delay: "00:00:01"

      - action: media_player.volume_set
        target:
          entity_id: media_player.jl_tenor
        data:
          volume_level: 0.7
